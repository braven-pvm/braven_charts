<style>
  .braven-docs-nav {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1rem;
    align-items: center;
    padding: .75rem 1rem;
    border-bottom: 1px solid #d7d4df;
  }

  #dartdoc-main-content .markdown img {
    max-width: 100%;
    height: auto;
    box-sizing: content-box;
  }

  #dartdoc-main-content .markdown table {
    display: table;
    table-layout: fixed;
    width: 100%;
    max-width: 100%;
  }

  #dartdoc-main-content .markdown th,
  #dartdoc-main-content .markdown td {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .braven-docs-links {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1rem;
  }

  @media (max-width: 600px) {
    .braven-docs-nav {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (document.querySelector('.braven-docs-nav')) return;

    var nav = document.createElement('nav');
    nav.className = 'braven-docs-nav';
    nav.setAttribute('aria-label', 'Braven Charts documentation');

    var brand = document.createElement('strong');
    brand.textContent = 'Braven Charts';
    nav.appendChild(brand);

    var links = document.createElement('span');
    links.className = 'braven-docs-links';
    [
      ['Showcase', 'https://braven-pvm.github.io/braven_charts/'],
      ['Documentation', 'https://braven-pvm.github.io/braven_charts/?page=docs'],
      ['Guides', 'https://braven-pvm.github.io/braven_charts/guides/'],
      ['pub.dev', 'https://pub.dev/packages/braven_charts'],
      ['GitHub', 'https://github.com/braven-pvm/braven_charts']
    ].forEach(function (entry) {
      var link = document.createElement('a');
      link.textContent = entry[0];
      link.href = entry[1];
      links.appendChild(link);
    });
    nav.appendChild(links);
    document.body.prepend(nav);
  });
</script>
