name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-showcase.yml
      - example/**
      - lib/**
      - doc/**
      - docs/**
      - dartdoc_options.yaml
      - tool/public_docs.dart
      - tool/public_docs_support.dart
      - tool/public_guides.dart
      - pubspec.yaml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Verify public documentation catalog
        run: dart run tool/public_docs.dart --check

      - name: Analyze package library
        run: flutter analyze lib

      - name: Resolve showcase dependencies
        working-directory: example
        run: flutter pub get

      - name: Build showcase
        working-directory: example
        run: flutter build web --release --base-href /braven_charts/

      - name: Generate hosted public guides
        run: dart run tool/public_guides.dart --output=example/build/web/guides

      - name: Generate hosted API reference
        run: |
          dart pub global activate dartdoc
          set -o pipefail
          dart pub global run dartdoc \
            --validate-links \
            --output example/build/web/api \
            --link-to-source-root . \
            --link-to-source-revision "$GITHUB_SHA" \
            --link-to-source-uri-template "https://github.com/braven-pvm/braven_charts/blob/%r%/%f%#L%l%" \
            2>&1 | tee /tmp/dartdoc.log
          if grep -qE '(^|[[:space:]])warning:' /tmp/dartdoc.log; then
            echo "::error::dartdoc emitted warnings; inspect the log above."
            exit 1
          fi

      - name: Verify hosted documentation artifact
        run: |
          test -f example/build/web/guides/index.html
          test -f example/build/web/guides/index.json
          dart run tool/public_docs.dart --check --api-dir=example/build/web/api

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: example/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v4
