name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/deploy-showcase.yml
      - example/**
      - lib/**
      - pubspec.yaml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Analyze package library
        run: flutter analyze lib

      - name: Resolve showcase dependencies
        working-directory: example
        run: flutter pub get

      - name: Build showcase
        working-directory: example
        run: flutter build web --release --base-href /braven_charts/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: example/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v4
