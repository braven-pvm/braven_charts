name: Package quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Regenerate surface_gen outputs
        run: dart run build_runner build

      - name: Verify generated surface is committed
        run: |
          if ! git diff --exit-code -- lib/src/fluent/generated lib/src/ai/generated lib/braven_charts_fluent.dart; then
            echo "::error::Generated surface is stale. The checked-in files under lib/src/fluent/generated (and lib/src/ai/generated), plus the generated opt-in barrel lib/braven_charts_fluent.dart, do not match what surface_gen produces from the current @chartSurface annotations. Run 'dart run build_runner build' locally and commit the result."
            exit 1
          fi

      - name: Analyze package library
        run: flutter analyze lib

      - name: Run package tests
        run: flutter test

      - name: Upload golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: test/golden/**/failures/**
          if-no-files-found: ignore

      - name: Analyze showcase
        working-directory: example
        run: flutter analyze

      - name: Generate public API documentation
        run: |
          dart pub global activate dartdoc
          dart pub global run dartdoc --no-validate-links

      - name: Validate publish archive
        run: dart pub publish --dry-run
