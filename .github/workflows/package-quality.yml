name: Package quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify changed Dart files are formatted
        run: dart run tool/check_dart_format.dart

      # Every other job in this workflow resolves on `channel: stable`, so the
      # Flutter floor declared in pubspec.yaml is never exercised. That is how
      # flex_color_picker ^3.8.0 shipped in 0.14.0 through 0.17.0 while the
      # package advertised Flutter >=3.35.0: the only release in that range
      # requires >=3.38.0, so version solving failed outright for anyone on
      # 3.35 to 3.37 and no gate noticed (BC-0060, BC-0063).
      - name: Verify dependencies resolve on the declared SDK floor
        run: dart run tool/check_dependency_floor.dart

      - name: Verify public documentation catalog
        run: |
          dart run tool/public_docs.dart --check
          dart run tool/public_guides.dart --output=build/public-guides-check

      # The generator enforces the whole config surface, so it is verified
      # before it is trusted to regenerate anything.
      - name: Analyze surface generator
        working-directory: tool/surface_gen
        run: dart pub get && dart analyze

      - name: Test surface generator
        working-directory: tool/surface_gen
        run: dart test

      - name: Regenerate surface_gen outputs
        run: dart run build_runner build

      # `git diff` IGNORES UNTRACKED FILES, so annotating a new class and
      # forgetting to `git add` its generated output would pass. `git status
      # --porcelain --untracked-files=all` sees both stale and uncommitted
      # files; any output at all is a failure.
      - name: Verify generated surface is committed
        run: |
          DIRTY=$(git status --porcelain --untracked-files=all -- lib/src/fluent/generated lib/src/ai/generated lib/braven_charts_fluent.dart test/fluent/fluent_smoke_generated_test.dart)
          if [ -n "$DIRTY" ]; then
            echo "$DIRTY"
            echo "::error::Generated surface is stale or uncommitted. The files under lib/src/fluent/generated (and lib/src/ai/generated), the generated opt-in barrel lib/braven_charts_fluent.dart, and the generated smoke test test/fluent/fluent_smoke_generated_test.dart do not match what surface_gen produces from the current @chartSurface annotations. Run 'dart run build_runner build' locally and commit the result (including any NEW generated files)."
            exit 1
          fi

      - name: Analyze package library
        run: flutter analyze lib

      - name: Run package tests
        run: |
          mapfile -t TEST_TARGETS < <(find test -type f -name '*_test.dart' ! -path 'test/benchmarks/*' | sort)
          flutter test "${TEST_TARGETS[@]}"

      # Wall-clock frame budgets are meaningful only when they are not racing
      # the functional suite or inheriting runtime state from another benchmark.
      # Keep every benchmark and its existing threshold, but execute each file
      # in its own serial Flutter process so a failure describes that measured
      # path rather than cross-benchmark contention or GC state.
      - name: Run package performance benchmarks
        run: |
          while IFS= read -r benchmark; do
            flutter test "$benchmark" --concurrency=1
          done < <(find test/benchmarks -type f -name '*_test.dart' | sort)

      - name: Upload golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-test-failures
          path: test/golden/**/failures/**
          if-no-files-found: ignore

      - name: Analyze showcase
        working-directory: example
        run: flutter analyze

      # The showcase pages are where several guarantees are ACCEPTANCE-tested:
      # a page is mounted, its live chart document is read off its own
      # controller, and the claim is asserted against the real widget tree
      # rather than a transcription. Those tests live here because the package's
      # own tests cannot import `example/lib`, so leaving the suite out of CI
      # meant a page-level regression (a Workbench pane that stops emitting, a
      # preset that stops rendering) could merge green.
      - name: Test showcase
        working-directory: example
        run: flutter test

      - name: Generate public API documentation
        run: |
          dart pub global activate dartdoc
          set -o pipefail
          dart pub global run dartdoc --validate-links 2>&1 | tee /tmp/dartdoc.log
          if grep -qE '(^|[[:space:]])warning:' /tmp/dartdoc.log; then
            echo "::error::dartdoc emitted warnings; inspect the log above."
            exit 1
          fi
          dart run tool/public_docs.dart --check --api-dir=doc/api

      - name: Validate publish archive
        run: dart pub publish --dry-run
