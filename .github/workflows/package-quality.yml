name: Package quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The generator enforces the whole config surface, so it is verified
      # before it is trusted to regenerate anything.
      - name: Analyze surface generator
        working-directory: tool/surface_gen
        run: dart pub get && dart analyze

      - name: Test surface generator
        working-directory: tool/surface_gen
        run: dart test

      - name: Regenerate surface_gen outputs
        run: dart run build_runner build

      # `git diff` IGNORES UNTRACKED FILES, so annotating a new class and
      # forgetting to `git add` its generated output would pass. `git status
      # --porcelain --untracked-files=all` sees both stale and uncommitted
      # files; any output at all is a failure.
      - name: Verify generated surface is committed
        run: |
          DIRTY=$(git status --porcelain --untracked-files=all -- lib/src/fluent/generated lib/src/ai/generated lib/braven_charts_fluent.dart)
          if [ -n "$DIRTY" ]; then
            echo "$DIRTY"
            echo "::error::Generated surface is stale or uncommitted. The files under lib/src/fluent/generated (and lib/src/ai/generated), plus the generated opt-in barrel lib/braven_charts_fluent.dart, do not match what surface_gen produces from the current @chartSurface annotations. Run 'dart run build_runner build' locally and commit the result (including any NEW generated files)."
            exit 1
          fi

      - name: Analyze package library
        run: flutter analyze lib

      - name: Run package tests
        run: flutter test

      - name: Upload golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: test/golden/**/failures/**
          if-no-files-found: ignore

      - name: Analyze showcase
        working-directory: example
        run: flutter analyze

      - name: Generate public API documentation
        run: |
          dart pub global activate dartdoc
          dart pub global run dartdoc --no-validate-links

      - name: Validate publish archive
        run: dart pub publish --dry-run
