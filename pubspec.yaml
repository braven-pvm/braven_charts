name: braven_charts
description: >-
  Pure Dart Flutter line, area, bar, scatter, Pie, Donut, and Concentric Donut
  charts with custom rendering, synchronized interaction, live data,
  annotations, and Dart source.
version: 0.9.0
homepage: https://braven-pvm.github.io/braven_charts/
repository: https://github.com/braven-pvm/braven_charts
issue_tracker: https://github.com/braven-pvm/braven_charts/issues
documentation: https://github.com/braven-pvm/braven_charts/blob/master/doc/api_reference.md

topics:
  - charts
  - data-visualization
  - flutter-widgets
  - annotations
  - streaming

screenshots:
  - description: >-
      Multi-axis training profile with a power area, heart-rate response,
      stage bands, target threshold, tracking, and a highlighted peak.
    path: doc/screenshots/hero_threshold.png
  - description: >-
      Bubble Scatter chart combining position, area-correct size encoding,
      distinct marker shapes, a quantitative size legend, and tracking.
    path: doc/screenshots/scatter_market_opportunity.png
  - description: >-
      Three independently scaled Cartesian charts sharing a data-X cursor and
      synchronized X viewport while retaining local Y axes.
    path: doc/screenshots/synchronized_route_profile.png
  - description: >-
      Grouped Bar chart with gradients, targets, uncertainty intervals,
      tracking tooltip, and durable point interaction.
    path: doc/screenshots/bar_targets_interaction.png
  - description: >-
      Dark Concentric Donut comparing three independent portfolio mandates with
      weighted rings, a shared center, radial gradients, and stable categories.
    path: doc/screenshots/concentric_portfolio.png
  - description: >-
      Pie allocation chart with radial gradients, rounded separated slices,
      elevation, inside percentages, and a positioned legend.
    path: doc/screenshots/pie_portfolio_allocation.png
  - description: >-
      Dark partial-sweep Donut with center content, compact labels, gradients,
      rounded slices, and a release-readiness status treatment.
    path: doc/screenshots/donut_release_progress.png
  - description: >-
      Multi-series crosshair tracking across independently scaled line and
      area series.
    path: doc/screenshots/tracking_demo.gif
  - description: >-
      Pointer zoom and drag-to-pan on a dark multi-axis chart with a
      synchronized scrollbar.
    path: doc/screenshots/zoom_pan_demo.gif
  - description: >-
      A live chart pauses while samples continue buffering, then resumes with
      bounded catch-up and a follow-latest viewport.
    path: doc/screenshots/live_stream_demo.gif
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # braven_data:
  #   git:
  #     url: https://github.com/forcegage-pvm/braven_data.git
  fleather: ^1.27.0
  flex_color_picker: ^3.8.0
  parchment: ^1.27.0
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  mockito: ^5.6.4
  build_runner: ^2.4.5

flutter:
  uses-material-design: true
