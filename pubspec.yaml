name: braven_charts
description: >-
  Pure Dart Flutter line, area, bar, scatter, Pie, and Donut charts with custom
  rendering, multi-axis interaction, streaming, annotations, tables, and artifacts.
version: 0.5.0
homepage: https://braven-pvm.github.io/braven_charts/
repository: https://github.com/braven-pvm/braven_charts
issue_tracker: https://github.com/braven-pvm/braven_charts/issues
documentation: https://github.com/braven-pvm/braven_charts/blob/master/doc/api_reference.md

topics:
  - charts
  - data-visualization
  - flutter-widgets
  - annotations
  - streaming

screenshots:
  - description: >-
      Compact comparison of line, area, scatter, bar, pie, and Donut charts
      with distinct native Flutter rendering and theme treatments.
    path: doc/screenshots/chart_type_strip.png
  - description: >-
      Multi-axis training profile with a power area, heart-rate response,
      stage bands, target threshold, tracking, and a highlighted peak.
    path: doc/screenshots/hero_threshold.png
  - description: >-
      Dark power-duration model with six curves, positive and negative
      baseline fills, range sections, glow, annotations, and a scrollbar.
    path: doc/screenshots/hero_power_duration.png
  - description: >-
      Pie contribution chart with collision-managed outside labels,
      slice-derived borders, and category percentages.
    path: doc/screenshots/pie_revenue_contribution.png
  - description: >-
      Pie allocation chart with radial gradients, rounded separated slices,
      elevation, inside percentages, and a positioned legend.
    path: doc/screenshots/pie_portfolio_allocation.png
  - description: >-
      Positive and negative baseline fill across three independently scaled
      signals with inline labels.
    path: doc/screenshots/gallery_baseline.png
  - description: >-
      Raw VO2 signal with stage averages, target range, threshold lines, and a
      highlighted VO2max event.
    path: doc/screenshots/gallery_vo2_stage.png
  - description: >-
      Three Donut compositions with selection-aware center content, a partial
      sweep, variable radii, compact labels, and light and dark themes.
    path: doc/screenshots/gallery_donut_collection.png
  - description: >-
      Live sensor data in a follow-latest viewport with a visible synchronized
      scrollbar.
    path: doc/screenshots/gallery_live_sensor.png
  - description: >-
      Grouped Bar chart with gradients, per-category target
      markers, tracking tooltip, and durable point interaction.
    path: doc/screenshots/bar_targets_interaction.png
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # braven_data:
  #   git:
  #     url: https://github.com/forcegage-pvm/braven_data.git
  fleather: ^1.27.0
  flex_color_picker: ^3.8.0
  parchment: ^1.27.0
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  mockito: ^5.6.4
  build_runner: ^2.4.5

flutter:
  uses-material-design: true
