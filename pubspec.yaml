name: braven_charts
description: >-
  Pure Dart Flutter Cartesian and pie charts with custom rendering, multi-axis
  interaction, live streaming, editable annotations, data tables, and portable
  artifacts.
version: 0.4.0
homepage: https://braven-pvm.github.io/braven_charts/
repository: https://github.com/braven-pvm/braven_charts
issue_tracker: https://github.com/braven-pvm/braven_charts/issues
documentation: https://github.com/braven-pvm/braven_charts/blob/master/doc/api_reference.md

topics:
  - charts
  - data-visualization
  - flutter-widgets
  - annotations
  - streaming

screenshots:
  - description: >-
      Five-axis endurance analysis with seven signals, stage annotations,
      tracking tooltip, trend, thresholds, glow, and a synchronized scrollbar.
    path: doc/screenshots/native_multi_axis_interaction.png
  - description: >-
      Mixed interval chart with threshold-styled bars, cardiac drift, multiple
      axes, tracking, LT1 annotations, and a polynomial trend.
    path: doc/screenshots/hero_threshold.png
  - description: >-
      Dark power-duration model with six curves, positive and negative
      baseline fills, range sections, glow, annotations, and a scrollbar.
    path: doc/screenshots/hero_power_duration.png
  - description: >-
      Pie contribution chart with collision-managed outside labels,
      slice-derived borders, and category percentages.
    path: doc/screenshots/pie_revenue_contribution.png
  - description: >-
      Pie allocation chart with radial gradients, rounded separated slices,
      elevation, inside percentages, and a positioned legend.
    path: doc/screenshots/pie_portfolio_allocation.png
  - description: >-
      Positive and negative baseline fill across three independently scaled
      signals with inline labels.
    path: doc/screenshots/gallery_baseline.png
  - description: >-
      Raw VO2 signal with stage averages, target range, threshold lines, and a
      highlighted VO2max event.
    path: doc/screenshots/gallery_vo2_stage.png
  - description: >-
      Reusable lactate chart configuration presented as comparable reference
      and current-session small multiples.
    path: doc/screenshots/gallery_lactate.png
  - description: >-
      Live sensor data in a follow-latest viewport with a visible synchronized
      scrollbar.
    path: doc/screenshots/gallery_live_sensor.png
  - description: >-
      Point, range, and threshold annotations combined in one analytical chart.
    path: doc/screenshots/gallery_annotated.png
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # braven_data:
  #   git:
  #     url: https://github.com/forcegage-pvm/braven_data.git
  fleather: ^1.27.0
  flex_color_picker: ^3.8.0
  parchment: ^1.27.0
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  mockito: ^5.6.4
  build_runner: ^2.4.5

flutter:
  uses-material-design: true
