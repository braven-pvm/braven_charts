name: braven_charts
description: >-
  Pure Dart Flutter Line, Area, Range Area, Bar, Scatter, Candlestick, Pie,
  Donut, Concentric Donut, and Polar Column charts with custom rendering and
  live interaction.
version: 0.10.0
homepage: https://braven-pvm.github.io/braven_charts/
repository: https://github.com/braven-pvm/braven_charts
issue_tracker: https://github.com/braven-pvm/braven_charts/issues
documentation: https://github.com/braven-pvm/braven_charts/blob/master/doc/api_reference.md

topics:
  - charts
  - data-visualization
  - flutter-widgets
  - annotations
  - streaming

screenshots:
  - description: >-
      Multi-axis training profile with a power area, heart-rate response,
      stage bands, target threshold, tracking, and a highlighted peak.
    path: doc/screenshots/hero_threshold.png
  - description: >-
      Typed OHLC Candlestick chart with rising, falling, and doji bodies,
      a moving average, event range, threshold, tracking, and dark theme.
    path: doc/screenshots/candlestick_market_structure.png
  - description: >-
      Persistent Cartesian value summary resolving the active datum for a
      layered Line and Area chart without requiring hover state.
    path: doc/screenshots/value_summary_panel.png
  - description: >-
      Three independently scaled Cartesian charts sharing a data-X cursor,
      synchronized X viewport, and reusable full-domain navigator.
    path: doc/screenshots/synchronized_route_profile.png
  - description: >-
      Nightingale Rose composition using area-correct radial values, direct
      labels, a numeric radial axis, gradients, and elevation.
    path: doc/screenshots/polar_seasonal_rose.png
  - description: >-
      Bubble Scatter chart combining position, area-correct size encoding,
      distinct marker shapes, a quantitative size legend, and tracking.
    path: doc/screenshots/scatter_market_opportunity.png
  - description: >-
      Grouped Bar chart with gradients, targets, uncertainty intervals,
      tracking tooltip, and durable point interaction.
    path: doc/screenshots/bar_targets_interaction.png
  - description: >-
      Multi-series crosshair tracking across independently scaled line and
      area series.
    path: doc/screenshots/tracking_demo.gif
  - description: >-
      Pointer zoom and drag-to-pan on a dark multi-axis chart with a
      synchronized scrollbar.
    path: doc/screenshots/zoom_pan_demo.gif
  - description: >-
      A live chart pauses while samples continue buffering, then resumes with
      bounded catch-up and a follow-latest viewport.
    path: doc/screenshots/live_stream_demo.gif
environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # braven_data:
  #   git:
  #     url: https://github.com/forcegage-pvm/braven_data.git
  fleather: ^1.27.0
  flex_color_picker: ^3.8.0
  parchment: ^1.27.0
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  mockito: ^5.6.4
  build_runner: ^2.4.5

flutter:
  uses-material-design: true
