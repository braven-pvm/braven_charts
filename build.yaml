# Build configuration for the chart surface generator (tool/surface_gen).
#
# Run: dart run build_runner build --delete-conflicting-outputs
#
# Only the surface_gen builder is enabled, scoped to the config surface under
# lib/src/**. Generated files are checked in; CI regenerates and fails on
# diff. mockito's auto-applied mock builder is explicitly disabled (the stale
# test/mocks/mock_definitions.dart predates the current test suite and does
# not compile).
targets:
  $default:
    builders:
      surface_gen|surface_gen:
        enabled: true
        generate_for:
          include:
            - lib/src/**
          exclude:
            # The builder's own checked-in outputs are never inputs.
            - lib/src/fluent/generated/**
      # Regenerates lib/braven_charts_fluent.dart from the generated file set
      # (a later build phase; see tool/surface_gen/build.yaml).
      surface_gen|fluent_barrel:
        enabled: true
      mockito|mockBuilder:
        enabled: false
